<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compassion Course Foundation — Redesign directions</title>
  <meta name="description" content="Five design directions for a revamped compassioncf.com. Theme: inspirational, with an optimistic undertone.">
  <link rel="icon" href="shared/img/mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #1c1a2e; --bg: #fbf7f1; --red: #c8282d; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font: 16px/1.6 'DM Sans', system-ui, sans-serif; color: var(--ink); background: var(--bg); min-height: 100vh;
      background-image: radial-gradient(ellipse 80% 50% at 50% -10%, #ffe2c2 0%, transparent 70%); }
    a { color: inherit; text-decoration: none; }
    .wrap { width: min(1200px, 100% - 48px); margin: 0 auto; }
    .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 30px; padding: 72px 0 80px; max-width: 1240px; }
    .grid > .card { grid-column: span 2; }
    .grid > .card:nth-child(4) { grid-column: 2 / span 2; }
    .card { display: flex; flex-direction: column; background: #fff; border-radius: 22px; overflow: hidden; box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 24px 50px -30px rgba(40,30,60,.4); transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s; }
    .card:hover, .card:focus-visible { transform: translateY(-8px); box-shadow: 0 40px 70px -34px rgba(40,30,60,.55); }
    .card:focus-visible { outline: 3px solid var(--red); outline-offset: 4px; }
    .shot { aspect-ratio: 16/10; overflow: hidden; background: #eee; }
    .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top; transition: transform 1.2s cubic-bezier(.2,.8,.2,1); }
    .card:hover .shot img { transform: scale(1.04); }
    .body { padding: 24px 26px 26px; display: flex; flex-direction: column; flex: 1; }
    h2 { font: 500 28px/1.15 'Fraunces', serif; margin-bottom: 16px; }
    .swatches { display: flex; gap: 6px; }
    .swatches i { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
    .go { display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
    .go b { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--ink); color: #fff; font-weight: 500; transition: transform .3s, background .3s; }
    .card:hover .go b { transform: translateX(4px); background: var(--red); }
    @media (max-width: 960px) { .grid { grid-template-columns: 1fr; max-width: 560px; margin: 0 auto; } .grid > .card, .grid > .card:nth-child(4) { grid-column: auto; } }
  </style>
</head>
<body>
  <main class="wrap grid">
    <a class="card" href="v1/">
      <div class="shot"><img src="shared/img/previews/v1.jpg" alt="Preview of the Dawn direction"></div>
      <div class="body">
        <h2>Dawn</h2>
        <div class="go">
          <div class="swatches" aria-hidden="true"><i style="background:#0b1030"></i><i style="background:#4b2f6e"></i><i style="background:#f08a7a"></i><i style="background:#f6b860"></i><i style="background:#fff8ef"></i></div>
          <b aria-hidden="true">→</b>
        </div>
      </div>
    </a>

    <a class="card" href="v2/">
      <div class="shot"><img src="shared/img/previews/v2.jpg" alt="Preview of the Morning Paper direction"></div>
      <div class="body">
        <h2>Morning Paper</h2>
        <div class="go">
          <div class="swatches" aria-hidden="true"><i style="background:#f8f2e7"></i><i style="background:#1d1a17"></i><i style="background:#c8282d"></i><i style="background:#ffbf3c"></i><i style="background:#ffe0bd"></i></div>
          <b aria-hidden="true">→</b>
        </div>
      </div>
    </a>

    <a class="card" href="v3/">
      <div class="shot"><img src="shared/img/previews/v3.jpg" alt="Preview of the Bright Horizon direction"></div>
      <div class="body">
        <h2>Bright Horizon</h2>
        <div class="go">
          <div class="swatches" aria-hidden="true"><i style="background:#8fd0ff"></i><i style="background:#0f2648"></i><i style="background:#ff6b5b"></i><i style="background:#ffd23f"></i><i style="background:#4fd1b5"></i></div>
          <b aria-hidden="true">→</b>
        </div>
      </div>
    </a>
    <a class="card" href="v4/">
      <div class="shot"><img src="shared/img/previews/v4.jpg" alt="Preview of the Meridian direction"></div>
      <div class="body">
        <h2>Meridian</h2>
        <div class="go">
          <div class="swatches" aria-hidden="true"><i style="background:#0e1a2b"></i><i style="background:#1b2a40"></i><i style="background:#b8915a"></i><i style="background:#ece6dc"></i><i style="background:#f7f4ee"></i></div>
          <b aria-hidden="true">→</b>
        </div>
      </div>
    </a>
    <a class="card" href="v5/">
      <div class="shot"><img src="shared/img/previews/v5.jpg" alt="Preview of the Kindred direction"></div>
      <div class="body">
        <h2>Kindred</h2>
        <div class="go">
          <div class="swatches" aria-hidden="true"><i style="background:#231a18"></i><i style="background:#c0603f"></i><i style="background:#e8b79f"></i><i style="background:#f1e9df"></i><i style="background:#faf6f0"></i></div>
          <b aria-hidden="true">→</b>
        </div>
      </div>
    </a>
  </main>
</body>
</html>
